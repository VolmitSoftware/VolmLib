    }
}

Provider<RegularFile> missingSymbolLibrary = layout.buildDirectory.file("nativeBillowTest/missing-${nativeBillowName}")
tasks.register('buildMissingSymbolTestLibrary', Exec) {
    inputs.file('src/test/rust/missing-symbol.rs')
    outputs.file(missingSymbolLibrary)
    doFirst { missingSymbolLibrary.get().asFile.parentFile.mkdirs() }
    commandLine('rustc', '--edition=2024', '--crate-type=cdylib', 'src/test/rust/missing-symbol.rs', '-o', missingSymbolLibrary.get().asFile.absolutePath)
}
if (providers.gradleProperty('includeNativeBillow').map { String enabled -> Boolean.parseBoolean(enabled) }.getOrElse(false)) {
    tasks.withType(Test).configureEach {
        dependsOn(tasks.named('buildMissingSymbolTestLibrary'))
        systemProperty('volmlib.test.missingSymbolLibrary', missingSymbolLibrary.get().asFile.absolutePath)
    }
}

