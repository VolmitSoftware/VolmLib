    Configuration compatibility = configurations.create("minecraft26_3${platform}") {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
    dependencies.add(compatibility.name, coordinate)
    TaskProvider<JavaCompile> compileCompatibility = tasks.register("compile26_3${platform}Compatibility", JavaCompile) {
        source = sourceSets.main.java
        classpath = compatibility + files(sourceSets.main.compileClasspath.filter { File dependency ->
            !dependency.name.startsWith('paper-api-')
        })
        destinationDirectory.set(layout.buildDirectory.dir("classes/java/minecraft26_3${platform}"))
        options.annotationProcessorPath = configurations.annotationProcessor
        options.compilerArgs.add('-parameters')
        options.encoding = 'UTF-8'
        options.release.set(25)
    }
    tasks.named('check').configure {
        dependsOn(compileCompatibility)
    }
}

