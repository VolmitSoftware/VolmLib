import org.gradle.api.publish.maven.MavenPublication
import org.gradle.api.attributes.Usage
import org.gradle.api.attributes.java.TargetJvmVersion
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.toolchain.JavaLanguageVersion

plugins {
    id 'java-library'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.release.set(17)
}

tasks.named('compileTestJava', JavaCompile).configure {
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.release.set(17)
}

configurations {
    spigotCompatibility {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
        }
    }
    currentPaperCompatibility {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
    currentSpigotCompatibility {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}

tasks.register('compileSpigotCompatibility', JavaCompile) {
    source = sourceSets.main.java
    classpath = files(sourceSets.main.compileClasspath.filter { File dependency ->
        !dependency.name.startsWith('paper-api-')
    }) + configurations.spigotCompatibility
    destinationDirectory.set(layout.buildDirectory.dir('classes/java/spigotCompatibility'))
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.release.set(17)
}

tasks.register('compileCurrentPaperCompatibility', JavaCompile) {
    source = sourceSets.main.java
    classpath = configurations.currentPaperCompatibility + files(sourceSets.main.compileClasspath.filter { File dependency ->
        !dependency.name.startsWith('paper-api-')
    })
    destinationDirectory.set(layout.buildDirectory.dir('classes/java/currentPaperCompatibility'))
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.register('compileCurrentSpigotCompatibility', JavaCompile) {
    source = sourceSets.main.java
    classpath = configurations.currentSpigotCompatibility + files(sourceSets.main.compileClasspath.filter { File dependency ->
        !dependency.name.startsWith('paper-api-')
    })
    destinationDirectory.set(layout.buildDirectory.dir('classes/java/currentSpigotCompatibility'))
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.named('check').configure {
    dependsOn(tasks.named('compileSpigotCompatibility'))
    dependsOn(tasks.named('compileCurrentPaperCompatibility'))
    dependsOn(tasks.named('compileCurrentSpigotCompatibility'))
}

tasks.withType(Test).configureEach {
    jvmArgs('-Dnet.bytebuddy.experimental=true')
}

dependencies {
    compileOnly('io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT')
    spigotCompatibility('org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT')
    currentPaperCompatibility('io.papermc.paper:paper-api:26.1.2.build.74-stable')
    currentSpigotCompatibility('org.spigotmc:spigot-api:26.2-R0.1-SNAPSHOT')

    compileOnly('me.clip:placeholderapi:2.11.6') { transitive = false }
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') { transitive = false }

    compileOnly('org.projectlombok:lombok:1.18.44')
    annotationProcessor('org.projectlombok:lombok:1.18.44')

    implementation('com.google.code.gson:gson:2.10.1')
    implementation('it.unimi.dsi:fastutil:8.5.13')
    implementation('com.google.guava:guava:33.2.1-jre')
    implementation('com.github.ben-manes.caffeine:caffeine:3.1.8')
    implementation('com.googlecode.concurrentlinkedhashmap:concurrentlinkedhashmap-lru:1.4.2')
    implementation('org.apache.commons:commons-lang3:3.14.0')
    implementation('org.lz4:lz4-java:1.8.0')

    testImplementation('junit:junit:4.13.2')
    testImplementation('io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT')
    testImplementation('me.clip:placeholderapi:2.11.6') { transitive = false }
    testImplementation('com.github.MilkBowl:VaultAPI:1.7') { transitive = false }
    testImplementation('org.mockito:mockito-core:5.14.2')
    testImplementation('org.ow2.asm:asm:9.9.1')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = 'volmlib-shared'
            from(components.java)
        }
    }
}
