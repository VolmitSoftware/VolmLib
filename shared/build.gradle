    commandLine('rustc', '--edition=2024', '--crate-type=cdylib', 'src/test/rust/incorrect-billow.rs', '-o', incorrectBillowLibrary.get().asFile.absolutePath)
}
if (providers.gradleProperty('includeNativeBillow').map { String enabled -> Boolean.parseBoolean(enabled) }.getOrElse(false)) {
    tasks.withType(Test).configureEach {
        dependsOn(tasks.named('buildIncorrectBillowTestLibrary'))
