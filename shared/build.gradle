tasks.named('sourcesJar').configure {
    from('native/billow') {
        include('Cargo.toml', 'Cargo.lock', 'build.rs', 'src/**')
        into('rust/batch')
    }
}

tasks.register('buildBillowNative', Exec) {
    workingDir(file('native/billow'))
    commandLine('cargo', 'build', '--release', '--locked')
    inputs.files(fileTree('native/billow/src'), file('native/billow/Cargo.toml'), file('native/billow/Cargo.lock'), file('native/billow/build.rs'))
    outputs.dir(file('native/billow/target/release'))
}

tasks.register('testBillowBatch', Test) {
    dependsOn(tasks.named('billowBatchTestClasses'))
    testClassesDirs = sourceSets.billowBatchTest.output.classesDirs
    classpath = sourceSets.billowBatchTest.runtimeClasspath
    jvmArgs('--enable-native-access=ALL-UNNAMED')
}

tasks.register('testBillowNative', Test) {
    dependsOn(tasks.named('buildBillowNative'), tasks.named('billowBatchTestClasses'))
    testClassesDirs = sourceSets.billowBatchTest.output.classesDirs
    classpath = sourceSets.billowBatchTest.runtimeClasspath
    String systemName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    String libraryName = systemName.contains('mac') ? 'libvolmlib_billow.dylib' : systemName.contains('win') ? 'volmlib_billow.dll' : 'libvolmlib_billow.so'
    File batchLibrary = file("native/billow/target/release/${libraryName}")
    inputs.file(batchLibrary).withPropertyName('billowBatchLibrary')
    systemProperty('volmlib.billow.library', batchLibrary.absolutePath)
    if (['Mac OS X', 'Linux'].contains(System.getProperty('os.name'))
            && ['aarch64', 'arm64', 'amd64', 'x86_64'].contains(System.getProperty('os.arch'))) {
        dependsOn(tasks.named('buildNativeBillow'))
        inputs.file(nativeBillowLibrary).withPropertyName('scalarBillowLibrary')
        systemProperty('volmlib.noise.nativeBillow', 'true')
        systemProperty('volmlib.noise.nativeBillowLibrary', nativeBillowLibrary.get().asFile.absolutePath)
        systemProperty('volmlib.test.scalarBillowCoexistence', 'true')
    }
    jvmArgs('--enable-native-access=ALL-UNNAMED')
}

tasks.named('check').configure {
    dependsOn(tasks.named('testBillowBatch'))
}
