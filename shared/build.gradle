tasks.named('compileNativeBillowJava', JavaCompile).configure {
    options.release.set(25)
    options.compilerArgs.add('-parameters')
}

String nativeBillowOs = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac') ? 'macos' : 'linux'
String nativeBillowArch = ['aarch64', 'arm64'].contains(System.getProperty('os.arch')) ? 'aarch64' : 'x86_64'
String nativeBillowName = nativeBillowOs == 'macos' ? 'libvolmlib-billow.dylib' : 'libvolmlib-billow.so'
Provider<Directory> nativeBillowResources = layout.buildDirectory.dir('generated/nativeBillowResources')
Provider<RegularFile> nativeBillowLibrary = nativeBillowResources.map { Directory directory ->
    directory.file("art/arcane/volmlib/native-billow/${nativeBillowOs}-${nativeBillowArch}/${nativeBillowName}")
}

Provider<String> nativeBillowCompilerDetails = providers.exec { commandLine('rustc', '-vV') }.standardOutput.asText
String nativeBillowTarget = nativeBillowArch + (nativeBillowOs == 'macos' ? '-apple-darwin' : '-unknown-linux-gnu')

tasks.register('buildNativeBillow', Exec) {
    inputs.file('src/main/rust/billow.rs')
    inputs.property('rustCompilerVersion', nativeBillowCompilerDetails.map { String version -> version.trim() })
    inputs.property('targetPlatform', nativeBillowOs + '-' + nativeBillowArch)
    inputs.property('compilerFlags', '--edition=2024 --crate-type=cdylib -C opt-level=3 -C panic=abort')
    outputs.file(nativeBillowLibrary)
    doFirst {
        if (!['Mac OS X', 'Linux'].contains(System.getProperty('os.name')) ||
                !['aarch64', 'arm64', 'amd64', 'x86_64'].contains(System.getProperty('os.arch'))) {
            throw new GradleException('Native Billow builds support macOS/Linux aarch64/x86_64 hosts')
        }
        if (!nativeBillowCompilerDetails.get().readLines().contains('host: ' + nativeBillowTarget)) {
            throw new GradleException('rustc host must match native Billow resource target ' + nativeBillowTarget)
        }
        nativeBillowLibrary.get().asFile.parentFile.mkdirs()
    }
    commandLine('rustc', '--edition=2024', '--crate-type=cdylib', '-C', 'opt-level=3', '-C', 'panic=abort',
            'src/main/rust/billow.rs', '-o', nativeBillowLibrary.get().asFile.absolutePath)
}

tasks.named('jar').configure {
    from(sourceSets.nativeBillow.output)
}

tasks.named('sourcesJar').configure {
    from(sourceSets.nativeBillow.allSource)
    exclude('art/arcane/volmlib/native-billow/**')
    from('src/main/rust') { into('rust') }
}

if (providers.gradleProperty('includeNativeBillow').map { String enabled -> Boolean.parseBoolean(enabled) }.getOrElse(false)) {
    sourceSets.main.resources.srcDir(nativeBillowResources)
    tasks.named('processResources').configure { dependsOn(tasks.named('buildNativeBillow')) }
    tasks.named('sourcesJar').configure { dependsOn(tasks.named('buildNativeBillow')) }
} else {
    tasks.named('jar').configure { exclude('art/arcane/volmlib/native-billow/**') }
}

