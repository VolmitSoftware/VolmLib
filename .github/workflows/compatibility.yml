name: Compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # The org variable CI_RUNNER picks the build runners. Pull requests always stay on GitHub's.
    runs-on: ${{ github.event_name != 'pull_request' && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Check out VolmLib
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and verify compatibility
        run: ./gradlew build
