name: Compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Build and test
            arguments: build -x :shared:compileApiCompatibility
          - check: API compatibility
            arguments: :shared:compileApiCompatibility
    steps:
      - name: Check out VolmLib
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: ${{ matrix.check }}
        run: ./gradlew ${{ matrix.arguments }}
