plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(17)
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
}

gradlePlugin {
    plugins {
        packaging {
            id = 'art.arcane.volmit-packaging'
            implementationClass = 'art.arcane.volmit.packaging.PluginPackagingPlugin'
        }
    }
}

dependencies {
    implementation('org.ow2.asm:asm:9.10.1')
    implementation('org.ow2.asm:asm-commons:9.10.1')
    implementation('org.apache.commons:commons-compress:1.28.0')
    implementation('com.google.code.gson:gson:2.10.1')
    implementation('com.github.depsypher:pngtastic:1.8')
    implementation('com.guardsquare:proguard-base:7.10.0')
    implementation('com.guardsquare:proguard-core:9.4.0')
    implementation('org.apache.logging.log4j:log4j-core:2.26.1')
    testImplementation(gradleTestKit())
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

int testForkCount = providers.gradleProperty('volmLibTestForks')
        .map { String forks -> Integer.parseInt(forks) }
        .getOrElse(Math.max(1, Runtime.runtime.availableProcessors().intdiv(2)))

tasks.named('test') {
    useJUnitPlatform()
    maxParallelForks = testForkCount
}
