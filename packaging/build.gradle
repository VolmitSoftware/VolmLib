plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(17)
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
}

gradlePlugin {
    plugins {
        packaging {
            id = 'art.arcane.volmit-packaging'
            implementationClass = 'art.arcane.volmit.packaging.PluginPackagingPlugin'
        }
    }
}

dependencies {
    implementation('org.tukaani:xz:1.10')
    implementation('org.ow2.asm:asm:9.10.1')
    implementation('org.ow2.asm:asm-commons:9.10.1')
    implementation('org.ow2.asm:asm-tree:9.10.1')
    implementation('org.ow2.asm:asm-analysis:9.10.1')
    implementation('org.apache.commons:commons-compress:1.28.0')
    implementation('com.google.code.gson:gson:2.10.1')
    implementation('com.github.depsypher:pngtastic:1.8')
    implementation('com.guardsquare:proguard-base:7.10.0')
    implementation('com.guardsquare:proguard-core:9.4.0')
    implementation('org.apache.logging.log4j:log4j-core:2.26.1')
    testImplementation(gradleTestKit())
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

int testForkCount = providers.gradleProperty('volmLibTestForks')
        .map { String forks -> Integer.parseInt(forks) }
        .getOrElse(Math.min(2, Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))))

tasks.named('test') {
    useJUnitPlatform()
    maxParallelForks = testForkCount
    systemProperty('junit.jupiter.execution.parallel.enabled', 'true')
    systemProperty('junit.jupiter.execution.parallel.mode.default', 'same_thread')
    systemProperty('junit.jupiter.execution.parallel.mode.classes.default', 'same_thread')
    systemProperty('junit.jupiter.execution.parallel.config.strategy', 'fixed')
    systemProperty('junit.jupiter.execution.parallel.config.fixed.parallelism', '2')
    systemProperty('junit.jupiter.execution.parallel.config.fixed.max-pool-size', '2')
}

File nativeMinecraftSources = file('../native/minecraft-common/src')
Map<String, String> nativeAccessRules = [
    fabric  : 'volmlib.accesswidener',
    forge   : 'META-INF/accesstransformer.cfg',
    neoforge: 'META-INF/accesstransformer.cfg'
]

tasks.named('processResources') {
    nativeAccessRules.each { String loader, String rules ->
        from(new File(nativeMinecraftSources, "${loader}/resources/${rules}")) {
            into("META-INF/volmlib/native-access/minecraft26_3/${loader}")
        }
    }
    new File(nativeMinecraftSources, 'versions').listFiles().findAll { File version ->
        nativeAccessRules.any { String loader, String rules -> new File(version, "resources/${loader}/${rules}").isFile() }
    }.each { File version ->
        String implementation = 'minecraft' + version.name.replace('.', '_')
        nativeAccessRules.each { String loader, String rules ->
            from(new File(version, "resources/${loader}/${rules}")) {
                into("META-INF/volmlib/native-access/${implementation}/${loader}")
            }
        }
    }
}

configurations {
    packedDecoder
}

dependencies {
    packedDecoder('org.tukaani:xz:1.10')
}

def packedRuntimeTemplate = tasks.register('packedRuntimeTemplate', Jar) {
    dependsOn(tasks.named('compileJava'))
    archiveFileName.set('xz-template.jar.bin')
    destinationDirectory.set(layout.buildDirectory.dir('tmp/packed-template'))
    from(tasks.named('compileJava').flatMap { it.destinationDirectory }) {
        include('art/arcane/volmit/packaging/runtime/**')
    }
    from({ configurations.packedDecoder.collect { zipTree(it) } }) {
        include('org/tukaani/xz/**/*.class')
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('processResources') {
    from(packedRuntimeTemplate) {
        into('META-INF/volmit')
    }
}

